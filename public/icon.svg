<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#0a0314"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#9333ea" stroke-width="6" stroke-opacity="0.5"/>
  <!-- Card Back Outline -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="#2e1065" stroke="#a855f7" stroke-width="8" filter="url(#glow)"/>
  <!-- Golden Naira Symbol -->
  <text x="256" y="325" font-family="Arial, sans-serif" font-weight="900" font-size="220" text-anchor="middle" fill="url(#gold)" filter="url(#glow)">₦</text>
</svg>
